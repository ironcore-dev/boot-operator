apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "boot-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - boot.ironcore.dev
  resources:
  - httpbootconfig
  - ipxebootconfig
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - boot.ironcore.dev
  resources:
  - httpbootconfig/status
  - ipxebootconfig/status
  verbs:
  - get
- apiGroups:
  - boot.ironcore.dev
  resources:
  - httpbootconfigs
  - ipxebootconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - boot.ironcore.dev
  resources:
  - httpbootconfigs/finalizers
  - ipxebootconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - boot.ironcore.dev
  resources:
  - httpbootconfigs/status
  - ipxebootconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - metal.ironcore.dev
  resources:
  - serverbootconfigurations
  - servers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metal.ironcore.dev
  resources:
  - serverbootconfigurations/finalizers
  verbs:
  - update
- apiGroups:
  - metal.ironcore.dev
  resources:
  - serverbootconfigurations/status
  verbs:
  - get
  - patch
  - update
