name: Check Codegen

on:
  pull_request:

jobs:
  check-codegen:
    name: Run code generation checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v6.5.0
      with:
        go-version-file: 'go.mod'
    - name: Run code gen checks
      run: make check-gen
    - name: Compare the expected and actual generated files
      run: |
        if [ -n "$(git status --porcelain=v1)" ]; then
          echo "Detected uncommitted changes after build. Consider running 'make generate manifests docs helm fmt'."
          echo "See status below:"
          git status --porcelain=v1
          exit 1
        fi
